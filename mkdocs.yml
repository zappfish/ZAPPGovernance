site_name: ZAPP Governance Documents
site_url: https://zappfish.github.io/ZAPPGovernance/
site_description: Governance documents for the Zebrafish Toxicology Phenotype Atlas Project (ZAPP)
repo_url: https://github.com/zappfish/ZAPPGovernance
repo_name: zappfish/ZAPPGovernance
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.action.view

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - attr_list

nav:
  - Home: index.md
  - Project Governance: governance.md
  - Contribution Guidelines: contributing.md
  - Data Governance: data-governance.md
  - Code of Conduct: code-of-conduct.md
  - IP & Licensing: ip-and-licensing.md
